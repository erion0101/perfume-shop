name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PerfumeShop.sln

      - name: Build
        run: dotnet build PerfumeShop.sln -c Release --no-restore

      - name: Test (incl. architecture tests)
        run: dotnet test --solution PerfumeShop.sln -c Release --no-build

  web:
    name: Web (storefront + admin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Storybook
        run: pnpm build-storybook

  e2e:
    name: E2E (admin + storefront, Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: perfumeshop_e2e
          POSTGRES_USER: perfumeshop
          POSTGRES_PASSWORD: perfumeshop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U perfumeshop" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: dotnet build ../src/Bootstrapper/PerfumeShop.Api

      - name: Playwright browser
        run: pnpm --filter @perfumeshop/admin exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/apps/admin/playwright-report
            web/apps/storefront/playwright-report

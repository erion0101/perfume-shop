# Local development infrastructure. The API and web apps run on the host (see README).
# Ports are published on 127.0.0.1 only, so nothing is reachable from the local network.
name: perfumeshop

services:
  postgres:
    # pgvector image so "smells like" similarity can be added later without changing images.
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-perfumeshop}
      POSTGRES_USER: ${POSTGRES_USER:-perfumeshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-perfumeshop}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.58
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key-change-me-0123456789}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili-data:/meili_data

  seq:
    image: datalust/seq:2026.1
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true" # local dev only
    ports:
      - "127.0.0.1:8341:80"     # Seq UI
      - "127.0.0.1:5341:5341"   # log ingestion
    volumes:
      - seq-data:/data

volumes:
  postgres-data:
  meili-data:
  seq-data:
